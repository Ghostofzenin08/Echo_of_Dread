<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" rx="28" fill="#0b0f19"/>
  <!-- Outer temporal ring -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#1a2e4a" stroke-width="4"/>
  <!-- Echo loop trajectory -->
  <path d="M 64 20 A 44 44 0 1 1 20 64" fill="none" stroke="#00e5ff" stroke-width="6" stroke-linecap="round" stroke-dasharray="180 30"/>
  <!-- Secondary echo ring -->
  <circle cx="64" cy="64" r="30" fill="none" stroke="#d500f9" stroke-width="4" stroke-opacity="0.8" stroke-dasharray="80 20"/>
  <!-- Core glyph -->
  <circle cx="64" cy="64" r="14" fill="#00e5ff" fill-opacity="0.9"/>
  <circle cx="64" cy="64" r="6" fill="#ffffff"/>
  <!-- Temporal pulse marker -->
  <circle cx="64" cy="20" r="5" fill="#ffffff"/>
</svg>
